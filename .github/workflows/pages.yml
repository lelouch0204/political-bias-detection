name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [ init/template ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    name: Build site and deploy to GitHub Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.x'

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ./_site

      - name: Verify stylesheet was generated
        run: |
          if [ ! -f "./_site/assets/css/styles.css" ]; then
            echo "ERROR: Built stylesheet not found at _site/assets/css/styles.css" >&2
            echo "List of files in _site/assets/css:" >&2
            ls -la "./_site/assets/css" || true >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./_site

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
